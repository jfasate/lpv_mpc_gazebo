lpv_mpc_node:
  ros__parameters:
    use_sim_time: true

    # ── Reference line: the SINGLE place to choose which CSV to follow ──
    # Bare name resolves to src/csv_data/<name>.csv (or give a full '/...' path).
    #   'superspeedway_centerline' - superspeedway centerline  <-- follow this
    #   'test_worldv5'          - raw centerline (test_worldv5 map)
    #   'test_worldv5_optimize' - optimized corner-cut racing line
    #   'test_worldv5_mincurv'  - my min-curvature line (parked)
    reference_csv: 'superspeedway_centerline'
    # Deploy the neural planner: consume the horizon on /planning/ref_path from an
    # external generator (neural_generator). Revert to the CSV baseline with:
    #   git checkout 33d9e5b -- config/lpv_mpc_params.yaml && colcon build --packages-select lpv_mpc_gazebo
    ref_source: 'csv'
    ref_generator: 'builtin'

    # ── ref_source: 'topic' behaviour (used by lane_assist camera lane keeping) ──
    # Values here match what the node previously hardcoded, so nothing changes
    # until you edit them.
    ref_path_topic: '/planning/ref_path'
    # A horizon whose max |vx| is <= this is an explicit HOLD from the planner:
    # the controller stops the car instead of following a stale reference. The
    # lane detector publishes vx=0 this way when it goes blind.
    topic_stop_speed_thresh: 0.05
    topic_min_ref_speed: 0.0          # open-loop horizon: no speed floor
    topic_low_speed_mpc_thresh: 0.0
    topic_startup_speed: 0.4
    topic_reference_speed_floor: 0.10
    initialpose_topic: '/initialpose'
    obstacle_path_aware_enabled: true
    # superspeedway_centerline has a FLAT vx=1.5 m/s column, and min_ref_speed is
    # floored at 2.0 m/s (the dynamic bicycle model degenerates below that), so
    # 1.5*scale < 2.0 -> the whole lap runs at the 2.0 m/s floor and this knob is
    # inert until scale > 1.33. Left at 1.0 so the yaml doesn't imply otherwise.
    speed_scale: 1.0       # Scale waypoint speeds (increase in small steps once stable)

    # Drive-speed command (velocity setpoint sent to the sim servo).
    #   speed_ff_blend    : 0 = pure MPC accel-integration, 1 = pure raceline
    #                       feedforward. The feedforward commands the profiled
    #                       CSV speed directly so the servo applies real effort.
    #   cmd_accel_horizon : integration time [s] for the MPC accel term. Was
    #                       hardcoded to Ts=0.02 (only +0.06 m/s/tick, which
    #                       starved the servo); 0.15 gives up to +0.45 m/s/tick.
    speed_ff_blend: 0.0
    adaptive_speed_ff_enabled: true
    adaptive_speed_ff_blend_max: 0.40
    adaptive_speed_ff_risk_start: 0.60
    adaptive_speed_ff_slip_deg: 5.0
    adaptive_speed_ff_clearance_soft: 1.30
    adaptive_speed_ff_clearance_hard: 0.90
    cmd_accel_horizon: 0.15

    # Brake-lookahead: command the highest speed that can still brake (at
    # speed_lookahead_decel m/s^2) down to every reference speed within
    # speed_lookahead_time seconds ahead. Stops the car arriving at corners too
    # hot. Increase lookahead_time if it still enters corners fast; lower decel
    # to brake earlier/more conservatively.
    speed_lookahead_time: 1.8
    speed_lookahead_decel: 3.0

    # Brake controller (ported from the Frenet controller; replaces the old
    # reverse-speed hack). Braking deceleration is
    #   decel = brake_kp*(over_speed - brake_deadband) + brake_kff*(MPC requested decel)
    # slew-rate-limited to brake_slew_rate so it ramps smoothly instead of a
    # reverse-thrust step that jerked the dynamic model. It only ever lowers the
    # speed command. Tuning:
    #   brake_kp     up  -> firmer braking for a given over-speed
    #   brake_kff    up  -> brakes earlier on the MPC's own decel intent
    #   brake_slew_rate down -> smoother/gentler brake onset (but engages later)
    #   brake_decel_max     -> hard cap; keep < the plant's ~9.5 m/s^2 limit
    brake_kp: 3.0
    brake_kff: 1.0
    brake_deadband: 0.15
    brake_slew_rate: 40.0
    brake_decel_max: 8.0

    # Curvature-based speed cap (grip limit). The per-waypoint target speed is
    #   v_curv = curvature_speed_scale * sqrt(curvature_lateral_accel / |kappa|)
    # and in mode 'cap' the reference used is min(csv_speed, v_curv) -- i.e. the
    # raceline speed, but never faster than the a_lat grip budget allows in a
    # corner. Built once at load. This raceline already implies ~6.7 m/s^2 mean
    # lateral accel (p90 ~11.5), so a_lat ~9 trims only the most aggressive
    # corners; lower a_lat = more conservative (binds more), higher = looser.
    #   mode: off | cap | replace     kappa_source: csv | geometry
    curvature_speed_mode: cap
    curvature_lateral_accel: 5.5
    curvature_speed_scale: 1.0
    curvature_straight_speed: 0.0     # <=0 -> no straight cap
    curvature_min_speed: 0.0          # <=0 -> use min_ref_speed floor
    curvature_epsilon: 0.0001
    curvature_kappa_source: csv
    curvature_accel_delta: 2.0        # m/s per m, forward smoothing rate
    curvature_decel_delta: 4.0        # m/s per m, backward smoothing rate
    curvature_smoothing_passes: 2

    # Recovery guard: current-state and prediction-based safety caps. The
    # predictive guard catches cases where current error is still small but the
    # MPC horizon is already diverging from the raceline.
    recovery_lat_err: 0.8
    recovery_heading_err_deg: 30.0
    recovery_slip_err_deg: 8.0
    recovery_hard_lat_err: 2.0
    recovery_hard_heading_err_deg: 60.0
    recovery_hard_slip_err_deg: 15.0
    recovery_soft_speed_cap: 4.8
    recovery_speed_cap: 3.4
    recovery_soft_accel_cap: 1.0
    recovery_accel_cap: 0.0
    predictive_recovery_lat_growth: 0.85
    predictive_recovery_lat_end: 1.00
    predictive_recovery_heading_err_deg: 45.0
    predictive_recovery_hard_lat_growth: 2.50
    predictive_recovery_hard_lat_end: 3.00
    predictive_recovery_hard_heading_err_deg: 85.0

    # Cross-track PI on the heading reference. Kills the standing lateral offset
    # (measured 0.25 m inside on the superspeedway corners): the MPC's position
    # cost has almost no authority because the linearized X/Y rows are decoupled
    # from psi, so the error is fed into psi_ref, which does steer the car. The
    # integral is what makes it zero rather than merely smaller — it winds in
    # the standing bias the ~5% yaw-model mismatch needs.
    #   kp up      -> faster pull back to the line (too high = weave)
    #   ki up      -> kills the residual offset sooner (too high = overshoot)
    #   max_deg    -> hard cap on the heading bias. Only a guard against absurd
    #                 aim-off after a reset/teleport: at kp=1.0 the P term alone
    #                 is already 7 deg at 0.25 m of error, so a tight cap would
    #                 saturate in normal driving and mask the integral. 15 deg
    #                 binds at ~0.55 m, which is recovery territory anyway.
    #   int_max    -> anti-windup clamp on the integral state [m*s]
    # The loop is e'' + kp*e' + ki*e = 0 (speed cancels), so kp/ki set damping
    # and bandwidth directly: this pair is zeta=0.71, wn=0.71 rad/s. Retune off
    # the next run. Set kp and ki both to 0.0 for the old behaviour (A/B).
    crosstrack_kp: 1.0
    crosstrack_ki: 0.5
    crosstrack_int_max: 1.0
    crosstrack_max_deg: 15.0

    # Soft state constraints: slack on the state-limit rows so the QP is ALWAYS
    # feasible -> the controller never freezes the steering mid-slide. Slack is
    # penalised (L1 + L2); raise the penalties to hug the limits harder, lower
    # them to let the car exceed limits more gracefully. Set soft_constraints
    # false to revert to the old hard (can-be-infeasible) QP.
    # Penalties raised 10x: the previous (low) values let the QP freely violate
    # the lateral-velocity/slip limit, so the car slid/spun off the line. High
    # penalties make it respect grip (won't casually slide) while still being
    # always-feasible (never freezes the steering).
    soft_constraints: true
    slack_penalty_lin: 100000.0
    slack_penalty_quad: 1000.0

    # Per-run CSV debug log. Set enable_csv_log:false to turn off. log_dir is
    # normally overridden by the launch file to src/lpv_mpc_gazebo/log; this default is
    # only used when the node is run directly (ros2 run) without the launch.
    enable_csv_log: true
    # log_dir: '/home/jayesh/sim_gazebo/src/lpv_mpc_gazebo/log'

    # ROS topics
    odom_topic: '/ego_racecar/odom'
    scan_topic: '/scan'
    drive_topic: '/drive'

    # /scan wall-clearance logging. The lidar scan is centered on the vehicle
    # front in ROS LaserScan convention: front=0 deg, left=+90 deg, right=-90 deg.
    scan_front_angle_deg: 0.0
    scan_left_angle_deg: 90.0
    scan_right_angle_deg: -90.0
    scan_sector_width_deg: 10.0

    # Wall/object avoidance guard. MPPI handles walls with a distance-field
    # soft-hinge cost; this LPV-MPC version uses the same idea as a deterministic
    # LiDAR clearance speed cap. Outside the soft clearance it does nothing.
    # Inside the soft/hard band it ramps speed from wall_soft_speed_cap to
    # wall_hard_speed_cap and prevents further acceleration. At/below the hard
    # clearance it commands extra braking if the car is still above the cap.
    # superspeedway barriers sit exactly 1.5 m either side of the centerline
    # (3.0 m corridor). A 1.00 m soft clearance therefore fires at only 0.5 m of
    # lateral error and then pins wall_accel_cap=0 (car coasts); 0.70/0.40 keeps
    # the guard for a real wall approach without tripping on normal tracking.
    wall_avoidance_enabled: true
    wall_soft_clearance: 0.70
    wall_hard_clearance: 0.40
    wall_front_soft_clearance: 1.50
    wall_front_hard_clearance: 0.60
    wall_soft_speed_cap: 3.0
    wall_hard_speed_cap: 1.0
    wall_accel_cap: 0.0
    wall_brake_gain: 1.0
    wall_scan_max_age: 0.20

    # Forward-corridor obstacle detector. LiDAR points inside this corridor are
    # treated like MPPI keep-out costs: speed is capped when an object is close
    # in distance or time-to-collision. This catches objects/walls that are not
    # exactly on the single front beam.
    # OFF for the superspeedway reference-tracking test: the track has no objects,
    # and the turns are ~4.9 m radius, so the barrier enters the 0.75 m-wide
    # forward corridor at ~1.9 m (< obstacle_soft_distance 3.0) on every turn —
    # a false positive that caps speed and zeroes the accel cap mid-corner.
    # Re-enable when running the obstacle worlds.
    obstacle_avoidance_enabled: false
    obstacle_forward_angle_deg: 55.0
    obstacle_corridor_width: 0.75
    obstacle_soft_distance: 3.00
    obstacle_hard_distance: 0.90
    obstacle_soft_speed_cap: 6.8
    obstacle_hard_speed_cap: 1.5
    obstacle_ttc_soft: 1.35
    obstacle_ttc_hard: 0.75
    obstacle_brake_gain: 0.6

    # QP solver ('cvxopt', 'osqp', 'ecos', 'scs')
    qp_solver: 'osqp'

    # The linearized model is discretized with classic RK4 (Taylor-4 of the
    # matrix exponential). It is not configurable.

    # MPC timing
    Ts: 0.02              # Sample time [s] (50 Hz control loop)
    hz: 60                # Prediction horizon [steps] (60 * 0.02s = 1.2s)

    # F1Tenth vehicle parameters (from f110_gym simulator)
    m: 3.74               # Mass [kg]
    Iz: 0.04712           # Yaw moment of inertia [kg*m^2]
    Cf: 123.0             # Front cornering stiffness [N/rad]
    Cr: 131.0             # Rear cornering stiffness [N/rad]
    lf: 0.15875           # CG to front axle [m]
    lr: 0.17145           # CG to rear axle [m]
    mju: 0.015            # Rolling resistance coefficient
    steer_rate_limit: 3.2 # Steering actuator rate [rad/s], matches dynamics plant
    d_a_max: 0.5          # MPC accel-input change limit [m/s^2 per control step]

    # MPC cost weights (diagonal entries)
    #   Q, S: output weights for [x_dot, psi, X, Y]
    #   R:    input-rate weights for [d_delta, d_a]
    #   Q/S: [x_dot_weight, psi_weight, X_weight, Y_weight]
    #   R:   [d_delta_weight, d_accel_weight]
    #   High x_dot weight → track CSV speed profile (slows for curves)
    #   High psi weight   → follow heading (prevents oversteer/understeer)
    #   Moderate X/Y      → follow position without oscillation
    #   High R[0]         → smooth steering (prevents oscillation)
    Q_diag: [500.0, 2500.0, 1500.0, 1500.0]
    S_diag: [500.0, 2500.0, 1500.0, 1500.0]
    R_diag: [55.0, 8.0]
